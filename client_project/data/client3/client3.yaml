# VisDrone YOLO dataset config for client3
# Replace client3 with: client1, client2, or client3

path: data/client3      # relative to where you run client.py

train: images             # folder inside 'path' used for training
val:   images             # using same for val (small dataset)

nc: 10                    # number of classes

names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
